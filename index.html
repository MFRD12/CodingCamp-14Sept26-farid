<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" aria-label="Toggle theme">☀️ Light</button>
  </header>

  <!-- Error Banner -->
  <div id="error-banner" style="display:none" role="alert" aria-live="assertive">
    <span id="error-message"></span>
    <button id="error-dismiss" aria-label="Dismiss error">×</button>
  </div>

  <main>

    <!-- Balance Display -->
    <section id="balance-section" aria-label="Current balance">
      <div id="balance-display">
        <span class="balance-label">Total Balance:</span>
        <span id="balance-value">$0.00</span>
      </div>
      <div id="budget-warnings" aria-live="polite"></div>
    </section>

    <!-- Input Form -->
    <section aria-label="Add a transaction">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="name-input">Item Name</label>
          <input
            type="text"
            id="name-input"
            name="name"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
          <span class="field-error" id="name-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="amount-input">Amount ($)</label>
          <input
            type="number"
            id="amount-input"
            name="amount"
            min="0.01"
            max="999999999.99"
            step="0.01"
            placeholder="0.00"
          />
          <span class="field-error" id="amount-error" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <label for="category-input">Category</label>
          <select id="category-input" name="category">
            <option value="">-- Select a category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="field-error" id="category-error" aria-live="polite"></span>
        </div>

        <button type="submit" id="add-btn">Add Transaction</button>

      </form>
    </section>

    <!-- Budget Limits -->
    <section aria-label="Budget limits">
      <h2>Budget Limits</h2>
      <div id="budget-limits">

        <div class="budget-group">
          <label for="budget-food">Food Limit ($)</label>
          <input
            type="number"
            id="budget-food"
            class="budget-input"
            data-category="Food"
            min="0.01"
            step="0.01"
            placeholder="No limit"
          />
          <span class="budget-error" id="budget-food-error" aria-live="polite"></span>
        </div>

        <div class="budget-group">
          <label for="budget-transport">Transport Limit ($)</label>
          <input
            type="number"
            id="budget-transport"
            class="budget-input"
            data-category="Transport"
            min="0.01"
            step="0.01"
            placeholder="No limit"
          />
          <span class="budget-error" id="budget-transport-error" aria-live="polite"></span>
        </div>

        <div class="budget-group">
          <label for="budget-fun">Fun Limit ($)</label>
          <input
            type="number"
            id="budget-fun"
            class="budget-input"
            data-category="Fun"
            min="0.01"
            step="0.01"
            placeholder="No limit"
          />
          <span class="budget-error" id="budget-fun-error" aria-live="polite"></span>
        </div>

      </div>
    </section>

    <!-- Sort Controls -->
    <section aria-label="Sort transactions">
      <div id="sort-controls">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select" name="sort">
          <option value="default">Default (Newest First)</option>
          <option value="amount-asc">Amount: Low→High</option>
          <option value="amount-desc">Amount: High→Low</option>
          <option value="category-az">Category A–Z</option>
        </select>
      </div>
    </section>

    <!-- Transaction List -->
    <section aria-label="Transaction history">
      <h2>Transactions</h2>
      <ul id="transaction-list" aria-label="Transaction list">
        <li class="empty-message">No transactions recorded yet.</li>
      </ul>
    </section>

    <!-- Pie Chart -->
    <section aria-label="Spending by category">
      <h2>Spending by Category</h2>
      <div id="chart-container">
        <canvas id="spending-chart" aria-label="Pie chart of spending by category" role="img"></canvas>
      </div>
    </section>

  </main>

</body>
</html>
